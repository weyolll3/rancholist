<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Niveles</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<img src="policia.jpeg" class="side-img left-side left-size">
<img src="prohibidobebes.jpg" class="side-img right-side right-size">

<header>
  <nav>
    <div class="nav-left">
      <a href="index.html" class="logo-link">
        <img src="icono.png" alt="Logo" class="logo-img">
      </a>
      <a href="lista.html" class="nav-item">RANCHOLIST</a>
      <a href="payolist.html" class="nav-item">PAYOLIST</a>
      <a href="statsviewer.html" class="nav-item">STATSVIEWER</a>
    </div>
  </nav>
</header>

<div class="niveles-container">
  <div class="panel-niveles" id="panel-niveles"></div>
</div>

<script src="niveles.js"></script>
<script>
const panel = document.getElementById('panel-niveles');

fetch('niveles.csv')
  .then(response => response.text())
  .then(csv => {
    // Niveles desde el 151 hasta el final (el id ya es el global)
    const niveles = parseNiveles(csv).slice(150);

    niveles.forEach(nivel => {
      const nivelDiv = document.createElement('div');
      nivelDiv.classList.add('nivel');

      const videoId = youtubeId(nivel.url);

      const thumb = document.createElement('a');
      if (nivel.url) {
        thumb.href = nivel.url;
        thumb.target = "_blank";
      }
      thumb.classList.add('thumb');
      if (videoId) thumb.style.backgroundImage = `url('https://img.youtube.com/vi/${videoId}/hqdefault.jpg')`;
      else thumb.style.backgroundColor = '#ccc';

      const infoDiv = document.createElement('div');
      infoDiv.classList.add('demon-info');

      const titulo = document.createElement('h2');
      const linkTitulo = document.createElement('a');
      linkTitulo.href = `nivel.html?id=${nivel.id}`;
      linkTitulo.textContent = nivel.titulo;
      titulo.appendChild(linkTitulo);

      const stats = document.createElement('p');
      stats.textContent = `Verificador: ${nivel.stats.Verificador} | Ranchopoints: ${nivel.stats.Ranchopoints}`;

      infoDiv.appendChild(titulo);
      infoDiv.appendChild(stats);

      nivelDiv.appendChild(thumb);
      nivelDiv.appendChild(infoDiv);

      panel.appendChild(nivelDiv);
    });
  })
  .catch(err => {
    console.error("Error cargando CSV:", err);
    panel.innerHTML = "<p>Error al cargar los niveles. Revisa la ruta del CSV.</p>";
  });
</script>
</body>
</html>
