<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stats Viewer</title>
<link rel="stylesheet" href="style.css">
<style>

  .main-container {
    display: flex;
    flex: 1;
    height: calc(100vh - 70px);
  }

  .ranking {
    width: 250px;
    overflow-y: auto;
    background: white;
    border-right: 1px solid #ddd;
    padding: 10px;
  }

  .ranking .jugador {
    padding: 10px;
    cursor: pointer;
    border-bottom: 1px solid #eee;
  }

  .ranking .jugador:hover,
  .ranking .jugador.active {
    background-color: #e0f7e0;
  }

.perfil-container {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    background: transparent;   /* ahora NO tapa el fondo */
    transition: background 0.3s ease;
}

  .perfil-container h2 {
    margin-top: 0;
  }

  .nivel {
    display: flex;
    margin: 10px 0;
    padding: 10px;
    background: #fafafa;
    border-radius: 8px;
    align-items: center;
  }

  .thumb {
    width: 120px;
    height: 68px;
    background-size: cover;
    background-position: center;
    border-radius: 6px;
    margin-right: 15px;
    flex-shrink: 0;
  }

  .demon-info {
    flex: 1;
  }

  @media (max-width: 768px) {
    .main-container {
      flex-direction: column;
    }
    .ranking {
      width: 100%;
      height: 200px;
      border-right: none;
      border-bottom: 1px solid #ddd;
    }
  }
</style>
</head>
<body class="statsviewer-bg">
<header>
  <nav>
    <div class="nav-left">
      <!-- Logo -->
      <a href="index.html" class="logo-link">
        <img src="icono.png" alt="Logo" class="logo-img">
      </a>
      <!-- Enlaces -->
      <a href="lista.html" class="nav-item">RANCHOLIST</a>
      <a href="payolist.html" class="nav-item">PAYOLIST</a>
      <a href="statsviewer.html" class="nav-item">STATSVIEWER</a>
    </div>
  </nav>
</header>
<div class="main-container">
  <div class="ranking" id="ranking">
    <!-- Lista de jugadores -->
  </div>
  <div class="perfil-container" id="perfil-container">
  </div>
</div>

<script src="niveles.js"></script>
<script>
const rankingDiv = document.getElementById('ranking');
const perfilContainer = document.getElementById('perfil-container');

// Función para limpiar el título eliminando "#n - " al inicio
function limpiarTitulo(titulo){
  return titulo.replace(/^#\d+\s*-\s*/, '');
}

fetch('niveles.csv?nocache=' + new Date().getTime())
  .then(r => r.text())
  .then(csv => {
    // Mismo parser que lista, payolist y nivel
    const niveles = parseNiveles(csv).map(n => ({
      url: n.url,
      titulo: n.titulo,
      verificador: n.stats.Verificador,
      ranchopoints: parseFloat(n.stats.Ranchopoints) || 0,
      jugadores: n.jugadores,        // [{nombre, video}]
      globalIndex: n.id + 1          // posición real del nivel (1, 2, 3...)
    }));

    const jugadores = {};
    niveles.forEach(nivel => {
      nivel.jugadores.forEach(j => {
        const nombre = j.nombre;
        if (!nombre) return;
        if (!jugadores[nombre]) jugadores[nombre] = { nombre, total: 0, niveles: [] };
        jugadores[nombre].total += nivel.ranchopoints;
        jugadores[nombre].niveles.push({
          titulo: nivel.titulo,
          ranchopoints: nivel.ranchopoints,
          urlVideo: j.video,
          globalIndex: nivel.globalIndex
        });
      });
    });

    const ranking = Object.values(jugadores).sort((a,b) => b.total - a.total);
    const divsPorJugador = {};

    // Ranking de jugadores: mostrar #n Nombre + puntos
    ranking.forEach((jugador, index) => {
      const divJugador = document.createElement('div');
      divJugador.classList.add('jugador');
      const rank = index + 1; // #n
      divJugador.innerHTML = `#${rank} ${jugador.nombre} <span style="font-size:0.85em; color:gray;">${jugador.total.toFixed(2)} pts</span>`;
      divJugador.addEventListener('click', () => mostrarPerfil(jugador, divJugador, rank));
      rankingDiv.appendChild(divJugador);
      divsPorJugador[jugador.nombre] = divJugador;
    });

    function mostrarPerfil(jugador, divJugador, rank) {
      perfilContainer.style.background = "white";
      document.querySelectorAll('.ranking .jugador').forEach(d => d.classList.remove('active'));
      divJugador.classList.add('active');

      // Mostrar ranking en el perfil también
      perfilContainer.innerHTML = `<h2>#${rank} ${jugador.nombre} — ${jugador.total.toFixed(2)} pts</h2>`;

      // Ordenar niveles internamente
      jugador.niveles.sort((a,b) => a.globalIndex - b.globalIndex);

      // Hardest
      let hardest = jugador.niveles.length ? jugador.niveles[0] : null;
      if(hardest){
        const hardestDiv = document.createElement('div');
        hardestDiv.style.marginBottom = '40px';
        const hHeading = document.createElement('h3');
        hHeading.textContent = "Hardest";
        hHeading.style.fontWeight = "bold";
        hHeading.style.fontSize = "1.3em";
        hHeading.style.marginBottom = "15px";
        hardestDiv.appendChild(hHeading);

        const p = document.createElement('p');
        const span = document.createElement('span');
        if(hardest.urlVideo){
          const a = document.createElement('a');
          a.href = hardest.urlVideo;
          a.textContent = limpiarTitulo(hardest.titulo);
          a.target = "_blank";
          a.style = "font-weight:bold; color:black; text-decoration:none;";
          span.appendChild(a);
        } else {
          span.textContent = limpiarTitulo(hardest.titulo);
          span.style = "font-weight:bold; color:black;";
        }
        p.appendChild(span);
        hardestDiv.appendChild(p);
        perfilContainer.appendChild(hardestDiv);
      }

      // --- Secciones por rango ---
      const mainlist = jugador.niveles.filter(n => n.globalIndex <= 50);
      const extended = jugador.niveles.filter(n => n.globalIndex > 50 && n.globalIndex <= 100);
      const legacy = jugador.niveles.filter(n => n.globalIndex > 100 && n.globalIndex <= 150);
      const payolist = jugador.niveles.filter(n => n.globalIndex > 150);

      const crearSeccion = (nivelesArray, title, estilo) => {
        const section = document.createElement('div');
        section.style.marginBottom = "40px";

        const heading = document.createElement('h3');
        heading.textContent = `${title} (${nivelesArray.length})`;
        heading.style.fontWeight = "bold";
        heading.style.fontSize = "1.2em";
        heading.style.marginBottom = "15px";
        section.appendChild(heading);

        const p = document.createElement('p');

        nivelesArray.sort((a,b) => a.globalIndex - b.globalIndex);

        nivelesArray.forEach((nivel, i) => {
          const span = document.createElement('span');
          if(nivel.urlVideo){
            const a = document.createElement('a');
            a.href = nivel.urlVideo;
            a.textContent = limpiarTitulo(nivel.titulo);
            a.target = "_blank";
            a.style = estilo + "text-decoration:none;";
            span.appendChild(a);
          } else {
            span.textContent = limpiarTitulo(nivel.titulo);
            span.style = estilo;
          }
          p.appendChild(span);
          if(i < nivelesArray.length - 1){
            p.appendChild(document.createTextNode(' - '));
          }
        });

        section.appendChild(p);
        perfilContainer.appendChild(section);
      };

      crearSeccion(mainlist, "Mainlist ", "font-weight:bold; color:black;");
      crearSeccion(extended, "Extended ", "color:black;");
      crearSeccion(legacy, "Legacy ", "color:gray;");
      crearSeccion(payolist, "Payolist ", "color:#aaa; font-size:0.95em;");
    }

    // --- Mostrar automáticamente si hay ?jugador=Nombre ---
    const params = new URLSearchParams(window.location.search);
    const jugadorURL = params.get('jugador');
    if (jugadorURL) {
      const jugadorEncontrado = ranking.find(j => j.nombre === jugadorURL);
      const divJugador = jugadorEncontrado && divsPorJugador[jugadorEncontrado.nombre];
      if (divJugador) {
        mostrarPerfil(jugadorEncontrado, divJugador, ranking.indexOf(jugadorEncontrado) + 1);
        divJugador.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

  })
  .catch(err => console.error("Error cargando CSV:", err));
</script>

</body>
</html>
