<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nivel</title>
<link rel="stylesheet" href="style.css">
<style>
/* Contenedor principal */
#nivel-container {
  padding: 20px;
  max-width: 900px;
  margin: 0 auto;
}

/* Preview del video */
.nivel-preview {
  width: 100%;
  max-width: 800px;
  height: 450px;
  margin: 30px auto 20px;
}

.nivel-preview iframe {
  width: 100%;
  height: 100%;
  border: none;
}
.nivel-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 800px;
  margin: 0 auto 20px;
  padding: 10px 20px;
  background: var(--color-bg);
  border-radius: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}
.nivel-bar h2 {
  margin: 0;
  font-size: 2em;
}
.nivel-bar .verificador, .nivel-bar .ranchopoints {
  font-size: 1em;
  color: #555;
}
.jugadores-list {
  max-width: 800px;
  margin: 0 auto;
  background: var(--color-bg);
  border-radius: 10px;
  padding: 15px 20px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}
.jugadores-list h3 {
  margin-top: 0;
}
.jugador {
  padding: 5px 0;
  border-bottom: 1px solid #eee;
}
.jugador:last-child {
  border-bottom: none;
}
</style>
</head>
<body>

<header>
  <nav>
    <div class="nav-left">
      <a href="index.html" class="logo-link">
        <img src="icono.png" alt="Logo" class="logo-img">
      </a>
      <a href="lista.html" class="nav-item">RANCHOLIST</a>
      <a href="payolist.html" class="nav-item">PAYOLIST</a>
      <a href="statsviewer.html" class="nav-item">STATSVIEWER</a>
    </div>
  </nav>
</header>

<div id="nivel-container">
  <!-- Contenido se genera por JS -->
</div>

<script src="niveles.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const nivelId = parseInt(params.get('id'));

  const container = document.getElementById('nivel-container');

  fetch('niveles.csv')
    .then(response => response.text())
    .then(csv => {
      const niveles = parseNiveles(csv);

      if (isNaN(nivelId) || nivelId < 0 || nivelId >= niveles.length) {
        container.innerHTML = "<p>Nivel no encontrado</p>";
        return;
      }

      const nivel = niveles[nivelId];
      const videoId = youtubeId(nivel.url);

      // Preview del video
      if (videoId) {
        const previewDiv = document.createElement('div');
        previewDiv.classList.add('nivel-preview');
        const iframe = document.createElement('iframe');
        iframe.src = `https://www.youtube.com/embed/${videoId}`;
        iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
        iframe.allowFullscreen = true;
        previewDiv.appendChild(iframe);
        container.appendChild(previewDiv);
      }

      // Barra con nombre, verificador y ranchopoints
      const bar = document.createElement('div');
      bar.classList.add('nivel-bar');

      const titulo = document.createElement('h2');
      titulo.textContent = nivel.titulo;
      const verificador = document.createElement('span');
      verificador.classList.add('verificador');
      verificador.textContent = `Verificador: ${nivel.stats.Verificador}`;
      const puntos = document.createElement('span');
      puntos.classList.add('ranchopoints');
      puntos.textContent = `Ranchopoints: ${nivel.stats.Ranchopoints}`;

      bar.appendChild(titulo);
      bar.appendChild(verificador);
      bar.appendChild(puntos);
      container.appendChild(bar);

      // Lista de jugadores
      const jugadoresDiv = document.createElement('div');
      jugadoresDiv.classList.add('jugadores-list');
      jugadoresDiv.style.background = 'var(--color-bg)';
      jugadoresDiv.style.padding = '15px 20px';
      jugadoresDiv.style.borderRadius = '10px';
      jugadoresDiv.style.boxShadow = '0 2px 6px rgba(0,0,0,0.1)';

      const h3 = document.createElement('h3');
      h3.textContent = 'Putos amos';
      h3.style.marginTop = '0';
      h3.style.paddingBottom = '10px';
      jugadoresDiv.appendChild(h3);

      if (nivel.jugadores.length === 0) {
        const p = document.createElement('p');
        p.textContent = 'Ningún jugador registrado.';
        jugadoresDiv.appendChild(p);
      } else {
        nivel.jugadores.forEach(j => {
          const fila = document.createElement('div');
          fila.classList.add('jugador');
          fila.style.display = 'flex';
          fila.style.justifyContent = 'space-between';
          fila.style.alignItems = 'center';
          fila.style.padding = '8px 12px';
          fila.style.marginBottom = '6px';
          fila.style.borderRadius = '6px';
          fila.style.background = '#f0f0f0';

          // Link al perfil del jugador
          const jugadorLink = document.createElement('a');
          jugadorLink.href = `statsviewer.html?jugador=${encodeURIComponent(j.nombre)}`;
          jugadorLink.textContent = j.nombre;
          jugadorLink.style.fontWeight = '600';
          jugadorLink.style.color = '#074d07';
          jugadorLink.style.marginRight = '20px';
          fila.appendChild(jugadorLink);

          // Link al video (solo si existe)
          if (j.video) {
            const videoLink = document.createElement('a');
            videoLink.href = j.video;
            videoLink.target = "_blank";
            videoLink.textContent = "Ver video";
            videoLink.style.fontSize = '0.9em';
            videoLink.style.color = '#0881c6';
            videoLink.style.whiteSpace = 'nowrap';
            fila.appendChild(videoLink);
          }

          jugadoresDiv.appendChild(fila);
        });
      }

      container.appendChild(jugadoresDiv);
    })
    .catch(err => {
      console.error('Error cargando CSV:', err);
      container.innerHTML = "<p>Error al cargar los datos del nivel.</p>";
    });
</script>
</body>
</html>
